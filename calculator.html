<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilities Split Calculator</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f4f4f5;
            --card-bg: #ffffff;
            --text-main: #18181b;
            --text-muted: #71717a;
            --border: #e4e4e7;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            margin: 0;
        }

        .calculator-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .results {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            display: none; /* Hidden until calculated */
        }

        .group-section {
            background-color: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .group-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9375rem;
        }

        .result-row:last-child {
            margin-bottom: 0;
            padding-top: 0.5rem;
            border-top: 1px dashed #cbd5e1;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <h2>Bill Split Calculator</h2>

        <div class="input-group">
            <label for="electric">Electric Bill (RM)</label>
            <input type="number" id="electric" placeholder="0.00" min="0" step="0.01">
        </div>

        <div class="input-group">
            <label for="water">Water Bill (RM)</label>
            <input type="number" id="water" placeholder="0.00" min="0" step="0.01">
        </div>

        <div class="input-group">
            <label for="wifi">Wifi Bill (RM)</label>
            <input type="number" id="wifi" placeholder="0.00" min="0" step="0.01">
        </div>

        <button onclick="calculateBills()">Calculate Split</button>

        <div class="results" id="results">
            <!-- Group 1 Results -->
            <div class="group-section">
                <div class="group-title">Group 1 (HAS) - 3 People</div>
                <div class="result-row">
                    <span>Amount per person:</span>
                    <span id="g1-person">RM 0.00</span>
                </div>
                <div class="result-row">
                    <span>Total for Group 1:</span>
                    <span id="g1-total">RM 0.00</span>
                </div>
            </div>

            <!-- Group 2 Results -->
            <div class="group-section">
                <div class="group-title">Group 2 (MEJS) - 4 People</div>
                <div class="result-row">
                    <span>Amount per person:</span>
                    <span id="g2-person">RM 0.00</span>
                </div>
                <div class="result-row">
                    <span>Total for Group 2:</span>
                    <span id="g2-total">RM 0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateBills() {
            // Get input values (default to 0 if empty)
            const electric = parseFloat(document.getElementById('electric').value) || 0;
            const water = parseFloat(document.getElementById('water').value) || 0;
            const wifi = parseFloat(document.getElementById('wifi').value) || 0;

            // Constants
            const g1Count = 3;
            const g2Count = 4;
            const totalPeople = g1Count + g2Count; // 7

            // 1. Electric Calculations
            // Group 1 pays 20% flat for aircon, remaining 80% is shared by all 7
            const electricAircon = electric * 0.20; 
            const electricShared = electric * 0.80;

            const perPersonAircon = electricAircon / g1Count;
            const perPersonElectricShared = electricShared / totalPeople;

            // 2. Water & Wifi Calculations (Shared equally by 7)
            const perPersonWater = water / totalPeople;
            const perPersonWifi = wifi / totalPeople;

            // 3. Final Per-Person Totals
            const g1PerPerson = perPersonAircon + perPersonElectricShared + perPersonWater + perPersonWifi;
            const g2PerPerson = perPersonElectricShared + perPersonWater + perPersonWifi;

            // 4. Final Group Totals
            const g1Total = g1PerPerson * g1Count;
            const g2Total = g2PerPerson * g2Count;

            // Update the UI
            document.getElementById('g1-person').innerText = "RM " + g1PerPerson.toFixed(2);
            document.getElementById('g1-total').innerText = "RM " + g1Total.toFixed(2);
            
            document.getElementById('g2-person').innerText = "RM " + g2PerPerson.toFixed(2);
            document.getElementById('g2-total').innerText = "RM " + g2Total.toFixed(2);

            // Show results section
            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
